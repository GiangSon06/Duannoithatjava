<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Lỗi đặt hàng')}"></th:block></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<style>
.error-wrap { min-height:70vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.error-card {
    background:white; border-radius:20px; padding:50px 40px;
    box-shadow:0 8px 48px rgba(0,0,0,0.08); width:100%; max-width:460px; text-align:center;
}
.error-icon { font-size:70px; margin-bottom:20px; animation:shake .5s ease; }
@keyframes shake {
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-8px)}
    40%{transform:translateX(8px)}
    60%{transform:translateX(-6px)}
    80%{transform:translateX(6px)}
}
.error-title { font-size:24px; font-weight:800; color:#e74c3c; margin-bottom:10px; }
.error-msg   { font-size:14px; color:#777; line-height:1.7; margin-bottom:28px; }
.error-box   { background:#fdf2f2; border:1px solid #f5c6c6; border-radius:10px; padding:14px 18px; margin-bottom:24px; font-size:14px; color:#c0392b; text-align:left; }
.btns { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.btn-primary {
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 28px; background:linear-gradient(135deg,#bfa15f,#d4b870);
    color:white; border-radius:30px; text-decoration:none; font-weight:700; font-size:14px; transition:.2s;
}
.btn-primary:hover { transform:translateY(-1px); box-shadow:0 5px 20px rgba(191,161,95,.4); }
.btn-secondary {
    display:inline-flex; align-items:center; gap:8px;
    padding:12px 28px; background:#f5f5f5; color:#333;
    border-radius:30px; text-decoration:none; font-weight:700; font-size:14px; transition:.2s;
}
.btn-secondary:hover { background:#eee; }
</style>

<div class="error-wrap">
    <div class="error-card">
        <div class="error-icon">😢</div>
        <div class="error-title">Không thể tạo đơn hàng</div>
        <div class="error-msg">Đã xảy ra sự cố khi xử lý đơn hàng của bạn.</div>

        <div class="error-box" th:if="${error}">
            <i class="fas fa-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>

        <p style="font-size:13px;color:#aaa;margin-bottom:20px;">
            Giỏ hàng của bạn vẫn được giữ nguyên. Vui lòng thử lại!
        </p>

        <div class="btns">
            <a href="/checkout.php" class="btn-primary">
                <i class="fas fa-redo"></i> Thử lại
            </a>
            <a href="/index.php" class="btn-secondary">
                <i class="fas fa-home"></i> Trang chủ
            </a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
