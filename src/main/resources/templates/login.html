<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Đăng nhập')}"></th:block></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<style>
.auth-wrap { min-height:80vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.auth-card {
    background:white; border-radius:20px; padding:44px 40px;
    box-shadow:0 8px 48px rgba(0,0,0,0.1); width:100%; max-width:420px;
}
.auth-logo { text-align:center; margin-bottom:24px; }
.auth-logo span { font-size:40px; }
.auth-title { font-size:26px; font-weight:800; color:#1a1f2e; text-align:center; margin-bottom:6px; }
.auth-sub   { font-size:14px; color:#999; text-align:center; margin-bottom:28px; }

.input-group { margin-bottom:16px; }
.input-group label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:6px; }
.input-icon-wrap { position:relative; }
.input-icon-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#bbb; font-size:14px; }
.input-icon-wrap input { padding-left:38px; }
.input-icon-wrap .toggle-eye { left:auto; right:13px; cursor:pointer; font-size:14px; }
.input-icon-wrap .toggle-eye:hover { color:#555; }
.auth-input {
    width:100%; padding:11px 14px; border:1.5px solid #e8e8e8;
    border-radius:10px; font-size:14px; font-family:inherit;
    transition:border-color .2s; box-sizing:border-box;
}
.auth-input:focus { outline:none; border-color:#bfa15f; }

.auth-options { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; font-size:13px; }
.remember { display:flex; align-items:center; gap:6px; color:#666; cursor:pointer; }
.remember input { accent-color:#bfa15f; width:15px; height:15px; }
.forgot-link { color:#bfa15f; font-weight:600; text-decoration:none; }
.forgot-link:hover { text-decoration:underline; }

.btn-auth {
    width:100%; padding:13px; background:linear-gradient(135deg,#bfa15f,#d4b870);
    color:white; border:none; border-radius:10px; font-size:15px; font-weight:700;
    cursor:pointer; letter-spacing:.5px; transition:.2s;
}
.btn-auth:hover { transform:translateY(-1px); box-shadow:0 5px 20px rgba(191,161,95,.4); }

.msg-error { background:#fdf2f2; color:#c0392b; border:1px solid #f5c6c6; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:14px; }

.auth-footer-links { text-align:center; margin-top:22px; font-size:14px; color:#999; }
.auth-footer-links a { color:#bfa15f; font-weight:700; text-decoration:none; }
.auth-footer-links a:hover { text-decoration:underline; }
.divider { display:flex; align-items:center; gap:10px; margin:20px 0; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:#eee; }
.divider span { font-size:12px; color:#ccc; white-space:nowrap; }
</style>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo"><span>🛋️</span></div>
        <div class="auth-title">Chào mừng trở lại!</div>
        <div class="auth-sub">Đăng nhập để tiếp tục mua sắm</div>

        <div class="msg-error" th:if="${error}" th:text="${error}"></div>

        <form method="post" action="/login.php" id="loginForm">
            <div class="input-group">
                <label for="log_user">Tên đăng nhập hoặc Email</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-user icon"></i>
                    <input class="auth-input" type="text" id="log_user" name="username"
                           th:value="${oldUsername}" autocomplete="username"
                           placeholder="Nhập tên đăng nhập hoặc email" required>
                </div>
            </div>
            <div class="input-group">
                <label for="log_pass">Mật khẩu</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-lock icon"></i>
                    <input class="auth-input" type="password" id="log_pass" name="password"
                           autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                    <i class="fas fa-eye-slash toggle-eye icon" onclick="toggleEye('log_pass',this)"></i>
                </div>
            </div>
            <div class="auth-options">
                <label class="remember">
                    <input type="checkbox" name="remember" value="1"> Ghi nhớ đăng nhập
                </label>
                <a href="/quenmatkhau.php" class="forgot-link">Quên mật khẩu?</a>
            </div>
            <button type="submit" class="btn-auth">
                <i class="fas fa-sign-in-alt"></i> Đăng nhập
            </button>
        </form>

        <div class="divider"><span>Chưa có tài khoản?</span></div>
        <div class="auth-footer-links">
            <a href="/register.php">Đăng ký ngay — miễn phí 🎉</a>
        </div>
    </div>
</div>

<script>
function toggleEye(id, icon) {
    const inp = document.getElementById(id);
    const isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    icon.className = isText ? 'fas fa-eye-slash toggle-eye icon' : 'fas fa-eye toggle-eye icon';
}
</script>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
