<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Thanh toán MoMo')}"></th:block></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<style>
.momo-wrap { min-height:70vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.momo-card {
    background:white; border-radius:20px; padding:48px 40px;
    box-shadow:0 8px 48px rgba(0,0,0,0.08); width:100%; max-width:480px; text-align:center;
}
.momo-logo { font-size:60px; margin-bottom:18px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
.momo-title { font-size:24px; font-weight:800; color:#1a1f2e; margin-bottom:8px; }
.momo-sub   { font-size:14px; color:#999; margin-bottom:28px; }
.msg-error  { background:#fdf2f2; color:#c0392b; border:1px solid #f5c6c6; border-radius:8px; padding:12px 14px; margin-bottom:20px; font-size:14px; text-align:left; }
.momo-info  { background:#f8f0ff; border:1px solid #e6d0ff; border-radius:12px; padding:20px; margin-bottom:24px; text-align:left; }
.momo-info p { font-size:14px; color:#555; margin:6px 0; }
.momo-info strong { color:#a21caf; }
.btn-back { display:inline-flex; align-items:center; gap:8px; padding:12px 28px; background:#f5f5f5; color:#333; border-radius:30px; text-decoration:none; font-weight:700; font-size:14px; transition:.2s; }
.btn-back:hover { background:#eee; }
</style>

<div class="momo-wrap">
    <div class="momo-card">
        <div class="momo-logo">💜</div>
        <div class="momo-title">Thanh toán MoMo</div>
        <div class="momo-sub">Ví điện tử MoMo</div>

        <div class="msg-error" th:if="${error}">
            <i class="fas fa-exclamation-circle"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="momo-info" th:if="${error}">
            <p>Có lỗi xảy ra trong quá trình thanh toán.<br>
            Vui lòng thử lại hoặc chọn phương thức thanh toán khác.</p>
        </div>

        <div th:unless="${error}" style="margin-bottom:24px;">
            <div style="font-size:14px;color:#777;line-height:1.7;">
                Đang chuyển hướng đến cổng thanh toán MoMo...<br>
                Vui lòng không đóng trang này.
            </div>
            <div style="margin-top:16px;">
                <div style="width:40px;height:40px;border:4px solid #f0e6ff;border-top-color:#a21caf;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto;"></div>
            </div>
        </div>

        <a href="/checkout.php" class="btn-back">
            <i class="fas fa-arrow-left"></i> Quay lại thanh toán
        </a>
    </div>
</div>

<style>@keyframes spin { to { transform: rotate(360deg); } }</style>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
