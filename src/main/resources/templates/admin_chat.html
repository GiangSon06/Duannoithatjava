<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Chat khách hàng — GS LUXURY Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <th:block th:replace="~{admin_fragments :: adminStyle}"></th:block>
    <style>
    .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 0; height: calc(100vh - 130px); border-radius: 14px; overflow: hidden; border: 1px solid #eef0f4; background: white; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .chat-sidebar { background: #f8f9fb; border-right: 1px solid #eef0f4; overflow-y: auto; }
    .chat-sidebar-header { padding: 16px 18px; font-weight: 700; font-size: 14px; color: #1a1f2e; border-bottom: 1px solid #eef0f4; background: white; }
    .chat-user { display: block; padding: 13px 16px; border-bottom: 1px solid #f0f0f0; text-decoration: none; color: inherit; transition: background .15s; cursor: pointer; }
    .chat-user:hover { background: #f0f2f5; }
    .chat-user.active { background: linear-gradient(135deg,rgba(191,161,95,0.12),rgba(212,184,112,0.08)); border-left: 3px solid #bfa15f; }
    .chat-user-name { font-weight: 600; color: #1a1f2e; font-size: 13.5px; }
    .chat-user-preview { font-size: 12px; color: #aaa; margin-top: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .chat-main { display: flex; flex-direction: column; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; font-weight: 700; color: #1a1f2e; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 65%; padding: 10px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; }
    .msg-user { background: #f0f2f5; color: #1a1f2e; align-self: flex-start; border-bottom-left-radius: 4px; }
    .msg-admin { background: linear-gradient(135deg,#bfa15f,#d4b870); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; margin-top: 3px; opacity: .6; }
    .chat-input { padding: 14px 16px; border-top: 1px solid #f0f0f0; display: flex; gap: 10px; }
    .chat-input input { flex: 1; padding: 10px 14px; border: 1.5px solid #e0e4ea; border-radius: 22px; font-size: 13.5px; font-family: inherit; transition: border-color .2s; outline: none; }
    .chat-input input:focus { border-color: #bfa15f; }
    .chat-input button { padding: 10px 20px; background: linear-gradient(135deg,#bfa15f,#d4b870); color: white; border: none; border-radius: 22px; font-weight: 700; cursor: pointer; font-size: 13px; transition: .18s; }
    .chat-input button:hover { transform: scale(1.03); }
    .no-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; color: #bbb; font-size: 14px; gap: 10px; }
    </style>
</head>
<body>
<aside th:replace="~{admin_fragments :: sidebar}"></aside>

<div class="admin-wrap" style="padding-bottom:0">
    <div class="admin-page-title"><i class="fas fa-comments"></i> Chat khách hàng</div>

    <div class="chat-layout">
        <!-- SIDEBAR: danh sách user -->
        <div class="chat-sidebar">
            <div class="chat-sidebar-header">
                <i class="fas fa-users" style="color:#bfa15f"></i> Khách hàng
                <span style="font-size:12px;color:#aaa;font-weight:400;margin-left:6px"
                      th:text="'(' + ${#lists.size(users)} + ')'"></span>
            </div>
            <div th:each="u : ${users}">
                <a th:href="@{/admin_chat.php(user_id=${u.id})}"
                   class="chat-user" th:classappend="${currentUid != null and currentUid == u.id} ? 'active'">
                    <div style="display:flex;align-items:center;gap:10px">
                        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#bfa15f,#d4b870);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0"
                             th:text="${u.username != null ? u.username.substring(0,1).toUpperCase() : '?'}">U</div>
                        <div style="flex:1;min-width:0">
                            <div class="chat-user-name" th:text="${u.username}">user</div>
                            <div class="chat-user-preview" th:text="${u.last_msg ?: 'Chưa có tin nhắn'}"></div>
                        </div>
                    </div>
                </a>
            </div>
            <div th:if="${#lists.isEmpty(users)}" style="padding:20px;text-align:center;color:#aaa;font-size:13px">
                Chưa có khách hàng nào nhắn tin
            </div>
        </div>

        <!-- CHAT MAIN -->
        <div class="chat-main">
            <!-- Đang chọn user -->
            <div th:if="${currentUid != null}">
                <div class="chat-header">
                    <div style="width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#bfa15f,#d4b870);display:flex;align-items:center;justify-content:center;color:white;font-weight:700">
                        <i class="fas fa-user" style="font-size:14px"></i>
                    </div>
                    <span th:text="${currentUsername ?: 'Khách hàng'}">user</span>
                </div>
                <div class="chat-body" id="chatBody">
                    <div th:each="msg : ${messages}"
                         th:classappend="${msg.sender == 'admin'} ? 'msg msg-admin' : 'msg msg-user'"
                         class="msg">
                        <div th:text="${msg.message}"></div>
                        <div class="msg-time"
                             th:text="${msg.created_at != null ? #dates.format(msg.created_at, 'HH:mm dd/MM') : ''}"></div>
                    </div>
                    <div th:if="${#lists.isEmpty(messages)}" style="text-align:center;color:#aaa;font-size:13px;padding:20px">
                        Chưa có tin nhắn nào
                    </div>
                </div>
                <div class="chat-input">
                    <input id="msgInput" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendAdmin()">
                    <button onclick="sendAdmin()"><i class="fas fa-paper-plane"></i> Gửi</button>
                </div>
            </div>

            <!-- Chưa chọn user -->
            <div th:unless="${currentUid != null}" class="no-chat">
                <i class="fas fa-comments" style="font-size:48px;color:#ddd"></i>
                <div>Chọn khách hàng để xem và trả lời tin nhắn</div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
/*<![CDATA[*/
const currentUid = /*[[${currentUid}]]*/ null;
async function sendAdmin() {
    const input = document.getElementById('msgInput');
    if (!input || !input.value.trim() || !currentUid) return;
    const fd = new FormData();
    fd.append('message', input.value.trim());
    fd.append('user_id', currentUid);
    fd.append('sender', 'admin');
    await fetch('/chat_backend.php', { method: 'POST', body: fd });
    input.value = '';
    location.reload();
}
// Auto scroll to bottom
const cb = document.getElementById('chatBody');
if (cb) cb.scrollTop = cb.scrollHeight;
/*]]>*/
</script>
</body>
</html>
