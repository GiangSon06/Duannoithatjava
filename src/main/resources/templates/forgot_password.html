<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Quên mật khẩu')}"></th:block></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<style>
.auth-wrap { min-height:80vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.auth-card { background:white; border-radius:20px; padding:44px 40px; box-shadow:0 8px 48px rgba(0,0,0,0.1); width:100%; max-width:420px; }
.auth-logo { text-align:center; font-size:40px; margin-bottom:20px; }
.auth-title { font-size:24px; font-weight:800; color:#1a1f2e; text-align:center; margin-bottom:8px; }
.auth-sub   { font-size:13px; color:#999; text-align:center; margin-bottom:28px; line-height:1.6; }
.input-group { margin-bottom:18px; }
.input-group label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:6px; }
.input-icon-wrap { position:relative; }
.input-icon-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#bbb; font-size:14px; }
.auth-input { width:100%; padding:11px 14px 11px 38px; border:1.5px solid #e8e8e8; border-radius:10px; font-size:14px; font-family:inherit; transition:border-color .2s; box-sizing:border-box; }
.auth-input:focus { outline:none; border-color:#bfa15f; }
.btn-auth { width:100%; padding:13px; background:linear-gradient(135deg,#bfa15f,#d4b870); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; transition:.2s; }
.btn-auth:hover { transform:translateY(-1px); box-shadow:0 5px 20px rgba(191,161,95,.4); }
.msg-success { background:#d1e7dd; color:#0a3622; border:1px solid #a3cfbb; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:14px; }
.msg-error   { background:#fdf2f2; color:#c0392b; border:1px solid #f5c6c6; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:14px; }
.auth-footer-links { text-align:center; margin-top:22px; font-size:14px; color:#999; }
.auth-footer-links a { color:#bfa15f; font-weight:700; text-decoration:none; }
.auth-footer-links a:hover { text-decoration:underline; }
.steps { display:flex; gap:0; margin-bottom:28px; }
.step { flex:1; text-align:center; }
.step-dot { width:28px; height:28px; border-radius:50%; background:#eee; color:#aaa; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; margin:0 auto 5px; }
.step.active .step-dot  { background:linear-gradient(135deg,#bfa15f,#d4b870); color:white; }
.step.done .step-dot    { background:#27ae60; color:white; }
.step-label { font-size:11px; color:#aaa; }
.step.active .step-label { color:#bfa15f; font-weight:600; }
.step-line { flex:1; height:2px; background:#eee; margin-top:14px; }
.step-line.done { background:#27ae60; }
</style>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🔐</div>
        <div class="auth-title">Lấy lại mật khẩu</div>
        <div class="auth-sub">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</div>

        <!-- Steps -->
        <div class="steps">
            <div class="step active">
                <div class="step-dot">1</div>
                <div class="step-label">Nhập email</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-dot">2</div>
                <div class="step-label">Kiểm tra hộp thư</div>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-dot">3</div>
                <div class="step-label">Đặt lại mật khẩu</div>
            </div>
        </div>

        <div class="msg-success" th:if="${success}" th:text="${success}"></div>
        <div class="msg-error"   th:if="${error}"   th:text="${error}"></div>

        <form th:unless="${success}" method="post" action="/quenmatkhau.php">
            <div class="input-group">
                <label for="fp_email">Email tài khoản</label>
                <div class="input-icon-wrap">
                    <i class="fas fa-envelope icon"></i>
                    <input class="auth-input" type="email" id="fp_email" name="email"
                           autocomplete="email" placeholder="Nhập email đã đăng ký" required>
                </div>
            </div>
            <button type="submit" name="gui_yeu_cau" class="btn-auth">
                <i class="fas fa-paper-plane"></i> Gửi link đặt lại mật khẩu
            </button>
        </form>

        <div class="auth-footer-links">
            <a href="/login.php">← Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
