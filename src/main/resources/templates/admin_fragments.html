<style th:fragment="adminStyle">
@view-transition {
  navigation: auto;
}
::view-transition-old(root) {
  animation: 0.22s cubic-bezier(0.4, 0, 1, 1) both admin-fade-out;
}
::view-transition-new(root) {
  animation: 0.3s cubic-bezier(0.16, 1, 0.3, 1) both admin-fade-in;
}
@keyframes admin-fade-out {
  from { opacity: 1; transform: scale(1); }
  to { opacity: 0; transform: scale(0.995); }
}
@keyframes admin-fade-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

html, body { margin: 0; padding: 0; background: #f1f4f9; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; scroll-behavior: smooth; }
.admin-wrap { margin-left: 230px; padding: 30px 32px; min-height: 100vh; }
.admin-page-title { font-size: 22px; font-weight: 800; color: #1a1f2e; margin-bottom: 22px; display: flex; align-items: center; gap: 10px; }

.admin-card { background: white; border-radius: 14px; padding: 22px 24px; border: 1px solid #eef0f4; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-bottom: 20px; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.admin-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.06); }
.card-title { font-size: 14px; font-weight: 700; color: #1a1f2e; display: flex; align-items: center; gap: 8px; }
.card-title i { color: #bfa15f; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); text-decoration: none; }
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg,#bfa15f,#d4b870); color: white; }

.btn-danger  { background: #e74c3c; color: white; }

.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th { padding: 10px 14px; font-weight: 700; color: #888; text-align: left; border-bottom: 2px solid #f0f0f0; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.admin-table td { padding: 12px 14px; border-bottom: 1px solid #f8f8f8; vertical-align: middle; color: #1a1f2e; transition: background 0.15s ease; }

.admin-table tr:hover td { background: #fafbfc; }
