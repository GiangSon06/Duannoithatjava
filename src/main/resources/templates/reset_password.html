<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments :: head('Đặt lại mật khẩu')}"></th:block></head>
<body>
<header th:replace="~{fragments :: header}"></header>

<style>
.auth-wrap { min-height:80vh; display:flex; align-items:center; justify-content:center; padding:30px 16px; }
.auth-card { background:white; border-radius:20px; padding:44px 40px; box-shadow:0 8px 48px rgba(0,0,0,0.1); width:100%; max-width:420px; }
.auth-logo  { text-align:center; font-size:40px; margin-bottom:20px; }
.auth-title { font-size:24px; font-weight:800; color:#1a1f2e; text-align:center; margin-bottom:8px; }
.auth-sub   { font-size:13px; color:#999; text-align:center; margin-bottom:28px; }
.input-group { margin-bottom:16px; }
.input-group label { display:block; font-size:13px; font-weight:600; color:#555; margin-bottom:6px; }
.input-icon-wrap { position:relative; }
.input-icon-wrap .icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#bbb; font-size:14px; }
.input-icon-wrap .toggle-eye { left:auto; right:13px; cursor:pointer; }
.auth-input { width:100%; padding:11px 38px; border:1.5px solid #e8e8e8; border-radius:10px; font-size:14px; font-family:inherit; transition:border-color .2s; box-sizing:border-box; }
.auth-input:focus { outline:none; border-color:#bfa15f; }
.auth-input.ok    { border-color:#27ae60; }
.auth-input.error { border-color:#e74c3c; }
.pw-bar  { height:5px; background:#eee; border-radius:3px; margin-top:6px; overflow:hidden; }
.pw-fill { height:100%; border-radius:3px; width:0; transition:width .3s,background .3s; }
.pw-txt  { font-size:11px; margin-top:3px; color:#aaa; }
.btn-auth { width:100%; padding:13px; background:linear-gradient(135deg,#bfa15f,#d4b870); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; transition:.2s; margin-top:6px; }
.btn-auth:hover { transform:translateY(-1px); box-shadow:0 5px 20px rgba(191,161,95,.4); }
.msg-success { background:#d1e7dd; color:#0a3622; border:1px solid #a3cfbb; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:14px; }
.msg-error   { background:#fdf2f2; color:#c0392b; border:1px solid #f5c6c6; border-radius:8px; padding:12px 14px; margin-bottom:18px; font-size:14px; }
.auth-footer-links { text-align:center; margin-top:22px; font-size:14px; color:#999; }
.auth-footer-links a { color:#bfa15f; font-weight:700; text-decoration:none; }
.invalid-box { text-align:center; padding:20px 0; }
.invalid-icon { font-size:60px; margin-bottom:16px; }
</style>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">🔑</div>
        <div class="auth-title">Đặt lại mật khẩu</div>

        <div class="msg-success" th:if="${success}" th:text="${success}"></div>
        <div class="msg-error"   th:if="${error}"   th:text="${error}"></div>

        <!-- Form đặt lại nếu token hợp lệ -->
        <th:block th:if="${valid}">
            <div class="auth-sub">Tạo mật khẩu mới cho tài khoản của bạn.</div>
            <form method="post" action="/datlaimatkhau.php" id="resetForm">
                <input type="hidden" name="token" th:value="${token}">
                <div class="input-group">
                    <label for="rp_pass">Mật khẩu mới</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-lock icon"></i>
                        <input class="auth-input" type="password" id="rp_pass" name="password"
                               autocomplete="new-password" placeholder="6–26 ký tự, có chữ hoa và số"
                               oninput="checkStrength(this)" required>
                        <i class="fas fa-eye-slash toggle-eye icon" onclick="toggleEye('rp_pass',this)"></i>
                    </div>
                    <div class="pw-bar"><div id="rp_fill" class="pw-fill"></div></div>
                    <div id="rp_txt" class="pw-txt"></div>
                </div>
                <div class="input-group">
                    <label for="rp_confirm">Nhập lại mật khẩu</label>
                    <div class="input-icon-wrap">
                        <i class="fas fa-lock icon"></i>
                        <input class="auth-input" type="password" id="rp_confirm" name="confirm_password"
                               autocomplete="new-password" placeholder="Nhập lại mật khẩu mới"
                               oninput="checkConfirm(this)" required>
                        <i class="fas fa-eye-slash toggle-eye icon" onclick="toggleEye('rp_confirm',this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn-auth">
                    <i class="fas fa-save"></i> Đặt lại mật khẩu
                </button>
            </form>
        </th:block>

        <!-- Link không hợp lệ -->
        <th:block th:unless="${valid}">
            <div class="invalid-box">
                <div class="invalid-icon">⏰</div>
                <p style="color:#555;font-size:15px;margin-bottom:16px;">
                    Liên kết đặt lại mật khẩu <strong>không hợp lệ</strong> hoặc đã <strong>hết hạn</strong>.
                </p>
                <a href="/forgot_password.php" class="btn-auth" style="display:inline-block;text-decoration:none;padding:11px 28px;border-radius:10px;">
                    <i class="fas fa-redo"></i> Yêu cầu link mới
                </a>
            </div>
        </th:block>

        <div class="auth-footer-links">
            <a href="/login.php">← Quay lại đăng nhập</a>
        </div>
    </div>
</div>

<script>
function toggleEye(id, icon) {
    const inp = document.getElementById(id);
    const isText = inp.type === 'text';
    inp.type = isText ? 'password' : 'text';
    icon.className = isText ? 'fas fa-eye-slash toggle-eye icon' : 'fas fa-eye toggle-eye icon';
}
function checkStrength(el) {
    const v = el.value;
    const fill = document.getElementById('rp_fill');
    const txt  = document.getElementById('rp_txt');
    let s = 0;
    if (v.length >= 6)  s++;
    if (v.length >= 10) s++;
    if (/[A-Z]/.test(v)) s++;
    if (/[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    const colors = ['','#e74c3c','#f39c12','#3498db','#27ae60','#16a34a'];
    const labels = ['','Yếu','Trung bình','Khá mạnh','Mạnh','Rất mạnh'];
    const widths = ['','20%','40%','60%','80%','100%'];
    fill.style.width = widths[s] || '0'; fill.style.background = colors[s] || '';
    txt.textContent = labels[s] || ''; txt.style.color = colors[s] || '';
}
function checkConfirm(el) {
    const pwd = document.getElementById('rp_pass').value;
    el.classList.remove('ok','error');
    if (el.value) el.classList.add(el.value === pwd ? 'ok' : 'error');
}
document.getElementById('resetForm')?.addEventListener('submit', function(e) {
    const p = document.getElementById('rp_pass').value;
    const c = document.getElementById('rp_confirm').value;
    if (p.length < 6 || !/[A-Z]/.test(p) || !/[0-9]/.test(p)) {
        e.preventDefault(); alert('Mật khẩu cần có ít nhất 6 ký tự, 1 chữ hoa và 1 chữ số!'); return;
    }
    if (p !== c) { e.preventDefault(); alert('Mật khẩu nhập lại không khớp!'); }
});
</script>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
