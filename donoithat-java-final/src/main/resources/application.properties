spring.application.name=sland-java-final
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.error.include-message=always
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donoithat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:SLAND Shop}
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
app.momo.partner-code=${MOMO_PARTNER_CODE:MOMO}
app.momo.access-key=${MOMO_ACCESS_KEY:}
app.momo.secret-key=${MOMO_SECRET_KEY:}
app.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8080/momo_return.php}
app.momo.ipn-url=${MOMO_IPN_URL:http://localhost:8080/momo_ipn.php}
app.upload-dir=${UPLOAD_DIR:uploads}
