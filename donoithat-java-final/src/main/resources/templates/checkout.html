<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Thanh toán')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main class="checkout-container" style="max-width:1100px;margin:35px auto"><h1>Thanh toán</h1><div class="checkout-layout" style="display:grid;grid-template-columns:1.2fr .8fr;gap:30px"><section><form method="post" action="process_order.php" id="checkoutForm"><h3>Thông tin nhận hàng</h3><select id="savedAddress" onchange="fillAddress(this)"><option value="">-- Chọn địa chỉ đã lưu --</option><option th:each="a:${addresses}" th:value="${a.id}" th:attr="data-name=${a.full_name},data-phone=${a.phone},data-address=${a.address_line+', '+a.ward+', '+a.district+', '+a.province}" th:text="${a.full_name+' - '+a.address_line+', '+a.province}"></option></select><input id="fullname" name="fullname" th:value="${user.full_name}" placeholder="Họ tên" required><input id="phone" name="phone" th:value="${user.phone}" placeholder="Số điện thoại" required><textarea id="address" name="address" placeholder="Địa chỉ giao hàng" required></textarea><h3>Phương thức thanh toán</h3><label><input type="radio" name="payment_method" value="cod" checked> Thanh toán khi nhận hàng (COD)</label><label><input type="radio" name="payment_method" value="banking"> Chuyển khoản VietQR</label><label><input type="radio" name="payment_method" value="momo"> Ví MoMo</label><h3>Mã giảm giá</h3><div style="display:flex;gap:8px"><input id="voucher" name="voucher_code" placeholder="Nhập voucher"><button type="button" onclick="applyVoucherCheckout()">Áp dụng</button></div><p id="voucher-msg"></p><button type="submit" style="margin-top:20px">ĐẶT HÀNG</button></form></section><aside><h3>Đơn hàng của bạn</h3><div th:each="i:${cart}" style="display:flex;gap:10px;margin:10px 0"><img th:src="${i.image}" style="width:70px;height:70px;object-fit:cover"><div><b th:text="${i.name}"></b><div th:text="${'x '+i.quantity}"></div><span th:text="${money.fmt(i.price)}"></span></div></div><hr><p>Tạm tính: <b id="rawTotal" th:attr="data-total=${rawTotal}" th:text="${money.fmt(rawTotal)}"></b></p></aside></div></main><script>function fillAddress(s){let o=s.options[s.selectedIndex];if(!o.dataset.name)return;fullname.value=o.dataset.name;phone.value=o.dataset.phone;address.value=o.dataset.address;}async function applyVoucherCheckout(){let fd=new FormData();fd.append('code',voucher.value);fd.append('total',document.getElementById('rawTotal').dataset.total);let r=await fetch('apply_voucher.php',{method:'POST',body:fd});let j=await r.json();document.getElementById('voucher-msg').textContent=j.message||'';}</script><footer th:replace="~{fragments :: footer}"></footer></body></html>
