<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Cộng tác viên')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main style="max-width:1100px;margin:35px auto"><h1>Cộng tác viên SLAND</h1><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:15px"><div class="stat-box"><b>Số dư</b><h2 th:text="${money.fmt(affiliate.balance)}"></h2></div><div class="stat-box"><b>Tổng kiếm được</b><h2 th:text="${money.fmt(affiliate.total_earned)}"></h2></div><div class="stat-box"><b>Mã giới thiệu</b><h2 th:text="${affiliate.ref_code}"></h2></div></div><p>Link giới thiệu: <code th:text="${'http://localhost:8080/register.php?ref='+affiliate.ref_code}"></code></p><h2>Rút tiền</h2><form method="post" action="affiliate.php"><input type="hidden" name="action" value="withdraw"><input type="number" name="amount" min="50000" placeholder="Số tiền" required><input name="bank_name" th:value="${affiliate.bank_name}" placeholder="Ngân hàng" required><input name="bank_account" th:value="${affiliate.bank_account}" placeholder="Số tài khoản" required><input name="bank_owner" th:value="${affiliate.bank_owner}" placeholder="Chủ tài khoản" required><input name="note" placeholder="Ghi chú"><button>Gửi yêu cầu rút</button></form><h2>Hoa hồng</h2><table><tr><th>Đơn</th><th>Số tiền</th><th>Hoa hồng</th><th>Trạng thái</th></tr><tr th:each="c:${commissions}"><td th:text="${c.order_id}"></td><td th:text="${money.fmt(c.order_amount)}"></td><td th:text="${money.fmt(c.commission_amt)}"></td><td th:text="${c.status}"></td></tr></table><h2>Lịch sử rút tiền</h2><table><tr th:each="w:${withdrawals}"><td th:text="${money.fmt(w.amount)}"></td><td th:text="${w.status}"></td><td th:text="${w.created_at}"></td></tr></table></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
