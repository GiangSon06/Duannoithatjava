<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head(${pageTitle})}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><section class="banner"><div class="slides"><img src="picture/slide2.jpg" alt="Banner"><img src="picture/slide3.webp" alt="Banner"><img src="picture/slide4.jpeg" alt="Banner"><img src="picture/slide5.webp" alt="Banner"></div></section><section class="categories"><h2>Danh mục sản phẩm</h2><div class="category-list"><a class="cat-item" href="products.php">Tất cả</a><a class="cat-item" href="products.php?cate=3">Phòng khách</a><a class="cat-item" href="products.php?cate=1">Phòng ngủ</a><a class="cat-item" href="products.php?cate=2">Phòng ăn</a><a class="cat-item" href="products.php?cate=4">Học tập</a></div></section><section class="products"><h2>Sản phẩm nổi bật</h2><div class="product-list"><div class="product-card" th:each="p:${products}" th:attr="data-id=${p.id},data-name=${p.name},data-price=${p.price},data-img=${p.image_url},data-category=${p.category_id}"><a th:href="@{/product_detail.php(id=${p.id})}" class="product-link"><img th:src="${p.image_url}" th:alt="${p.name}"><h3 th:text="${p.name}"></h3></a><p class="old-price" th:if="${p.old_price != null}" th:text="${money.fmt(p.old_price)}"></p><p class="price" th:text="${money.fmt(p.price)}"></p><button onclick="addToCart(this)">Thêm vào giỏ</button></div></div></section><section class="reviews"><h2>Khách hàng nói gì?</h2><div class="review-list"><div class="review-card" th:each="r:${reviews}"><div class="stars" th:text="${'★'.repeat(r.rating)}"></div><p th:text="${r.content}"></p><strong th:text="${'- '+r.username}"></strong></div></div></section><th:block th:replace="~{fragments :: cart}"></th:block><footer th:replace="~{fragments :: footer}"></footer></body></html>
