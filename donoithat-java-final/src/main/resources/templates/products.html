<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head(${pageTitle})}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main class="products-page"><div class="products-layout"><aside class="filter-sidebar"><h3>Danh mục</h3><a href="products.php">Tất cả</a><a th:each="c:${categories}" th:href="@{/products.php(cate=${c.id})}" th:text="${c.name}"></a></aside><section class="products"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Sản phẩm</h2><form method="get"><input name="search" th:value="${search}" placeholder="Tìm sản phẩm"><button>Tìm</button></form></div><div class="product-list"><div class="product-card" th:each="p:${products}" th:attr="data-id=${p.id},data-name=${p.name},data-price=${p.price},data-img=${p.image_url},data-category=${p.category_id}"><a th:href="@{/product_detail.php(id=${p.id})}"><img th:src="${p.image_url}" th:alt="${p.name}"><h3 th:text="${p.name}"></h3></a><p class="old-price" th:if="${p.old_price != null}" th:text="${money.fmt(p.old_price)}"></p><p class="price" th:text="${money.fmt(p.price)}"></p><button onclick="addToCart(this)">Thêm vào giỏ</button></div></div></section></div></main><th:block th:replace="~{fragments :: cart}"></th:block><footer th:replace="~{fragments :: footer}"></footer></body></html>
