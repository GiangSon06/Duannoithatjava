<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Chat</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Chat khách hàng</h1><div style="display:grid;grid-template-columns:280px 1fr;gap:20px"><aside><a th:each="u:${users}" th:href="@{/admin_chat.php(user_id=${u.id})}" style="display:block;padding:10px;border-bottom:1px solid #ddd"><b th:text="${u.username}"></b><br><small th:text="${u.last_msg}"></small></a></aside><section><div id="adminMsgs"><div th:each="m:${messages}" th:text="${m.message}" style="padding:8px;margin:5px;background:#eee"></div></div><form th:if="${currentUid!=null}" onsubmit="sendAdmin(event)"><input type="hidden" id="uid" th:value="${currentUid}"><input id="msg" placeholder="Tin nhắn"><button>Gửi</button></form></section></div></main><script>async function sendAdmin(e){e.preventDefault();let fd=new FormData();fd.append('message',msg.value);fd.append('user_id',uid.value);await fetch('chat_backend.php',{method:'POST',body:fd});location.reload();}</script></body></html>
