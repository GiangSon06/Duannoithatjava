<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Hồ sơ cá nhân')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main style="max-width:1100px;margin:35px auto"><div style="display:grid;grid-template-columns:240px 1fr;gap:28px"><aside class="profile-sidebar"><h3 th:text="${user.full_name ?: user.username}"></h3><a href="profile.php?tab=info">Thông tin cá nhân</a><a href="profile.php?tab=password">Đổi mật khẩu</a><a href="profile.php?tab=address">Địa chỉ giao hàng</a><a href="profile.php?tab=orders">Đơn hàng</a><a th:if="${affiliate==null}" href="affiliate_register.php">Đăng ký cộng tác viên</a><a th:if="${affiliate!=null}" href="affiliate.php">Cộng tác viên</a></aside><section><p class="success" th:if="${success}" th:utext="${success}"></p><p class="error" th:if="${error}" th:utext="${error}"></p><div th:if="${tab=='info'}"><h2>Thông tin cá nhân</h2><form method="post" action="update_profile.php" enctype="multipart/form-data"><input type="hidden" name="action" value="update_info"><label>Họ tên</label><input name="full_name" th:value="${user.full_name}"><label>Số điện thoại</label><input name="phone" th:value="${user.phone}"><label>Ngày sinh</label><input type="date" name="birthday" th:value="${user.birthday}"><label>Giới tính</label><select name="gender"><option value="">-- Chọn --</option><option value="male" th:selected="${user.gender=='male'}">Nam</option><option value="female" th:selected="${user.gender=='female'}">Nữ</option><option value="other" th:selected="${user.gender=='other'}">Khác</option></select><label>Avatar</label><input type="file" name="avatar" accept="image/*"><button>Lưu thông tin</button></form></div><div th:if="${tab=='password'}"><h2>Đổi mật khẩu</h2><form method="post" action="update_profile.php"><input type="hidden" name="action" value="change_password"><input type="password" name="current_password" placeholder="Mật khẩu hiện tại" required><input type="password" name="new_password" placeholder="Mật khẩu mới" required><input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu" required><button>Đổi mật khẩu</button></form></div><div th:if="${tab=='address'}"><h2>Địa chỉ giao hàng</h2><div th:each="a:${addresses}" style="border:1px solid #ddd;padding:14px;margin:10px 0"><b th:text="${a.full_name}"></b> · <span th:text="${a.phone}"></span><p th:text="${a.address_line+', '+a.ward+', '+a.district+', '+a.province}"></p><span th:if="${a.is_default==1}">Mặc định</span><form th:if="${a.is_default!=1}" method="post" action="update_profile.php" style="display:inline"><input type="hidden" name="action" value="set_default_address"><input type="hidden" name="addr_id" th:value="${a.id}"><button>Đặt mặc định</button></form><form method="post" action="update_profile.php" style="display:inline"><input type="hidden" name="action" value="delete_address"><input type="hidden" name="addr_id" th:value="${a.id}"><button>Xóa</button></form></div><h3>Thêm địa chỉ</h3><form method="post" action="update_profile.php"><input type="hidden" name="action" value="save_address"><input name="addr_full_name" placeholder="Họ tên" required><input name="addr_phone" placeholder="Số điện thoại" required><input name="addr_province" placeholder="Tỉnh/Thành" required><input name="addr_district" placeholder="Quận/Huyện" required><input name="addr_ward" placeholder="Phường/Xã" required><input name="addr_line" placeholder="Số nhà, đường" required><label><input type="checkbox" name="is_default"> Địa chỉ mặc định</label><button>Thêm địa chỉ</button></form></div><div th:if="${tab=='orders'}"><h2>Đơn hàng gần đây</h2><div th:each="o:${orders}"><a th:href="@{/order_detail.php(id=${o.id})}" th:text="${'Đơn #'+o.id+' — '+o.status+' — '+money.fmt(o.total_money)}"></a></div></div></section></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
