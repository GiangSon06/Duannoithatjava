<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Sản phẩm</title><link rel="stylesheet" href="/style.css"></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1 th:text="${product==null?'Thêm sản phẩm':'Sửa sản phẩm'}"></h1><form method="post" enctype="multipart/form-data" th:action="${product==null?'/admin_add_product.php':'/admin_edit_product.php'}"><input th:if="${product!=null}" type="hidden" name="id" th:value="${product.id}"><label>Tên</label><input name="name" th:value="${product?.name}" required><label>Giá</label><input type="number" name="price" th:value="${product?.price}" required><label>Giá cũ</label><input type="number" name="old_price" th:value="${product?.old_price}"><label>Danh mục</label><select name="category_id"><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${product!=null and product.category_id==c.id}"></option></select><label>Số lượng</label><input type="number" name="quantity" th:value="${product?.quantity ?: 0}"><label>Chất liệu</label><input name="material" th:value="${product?.material}"><label>Kích thước</label><input name="dimensions" th:value="${product?.dimensions}"><label>Bảo hành</label><input name="warranty" th:value="${product?.warranty}"><label>Mô tả</label><textarea name="description" th:text="${product?.description}"></textarea><label>Ảnh</label><input type="file" name="image" accept="image/*"><button>Lưu sản phẩm</button></form></main></body></html>
