<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Khuyến mãi')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><section class="products"><h2>Sản phẩm khuyến mãi</h2><div class="product-list"><div class="product-card" th:each="p:${products}"><a th:href="@{/product_detail.php(id=${p.id})}"><img th:src="${p.image_url}"><h3 th:text="${p.name}"></h3></a><p class="old-price" th:text="${money.fmt(p.old_price)}"></p><p class="price" th:text="${money.fmt(p.price)}"></p></div></div><h2>Mã giảm giá</h2><div class="voucher-list"><div class="voucher-card" th:each="v:${vouchers}"><b th:text="${v.code}"></b><p th:text="${v.discount_type=='percent' ? 'Giảm '+v.discount_value+'%' : 'Giảm '+money.fmt(v.discount_value)}"></p></div></div></section><footer th:replace="~{fragments :: footer}"></footer></body></html>
