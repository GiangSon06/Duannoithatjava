<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Voucher</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Voucher</h1><form method="post"><input type="hidden" name="action" value="add"><input name="code" placeholder="Mã" required><select name="discount_type"><option value="percent">%</option><option value="fixed">Cố định</option></select><input name="discount_value" type="number" placeholder="Giá trị" required><input name="min_order" type="number" placeholder="Đơn tối thiểu"><input name="max_uses" type="number" value="100"><input name="expires_at" type="date"><button>Thêm voucher</button></form><table><tr th:each="v:${vouchers}"><td th:text="${v.code}"></td><td th:text="${v.discount_type}"></td><td th:text="${v.discount_value}"></td><td th:text="${v.used_count+'/'+v.max_uses}"></td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" th:value="${v.id}"><button>Xóa</button></form></td></tr></table></main></body></html>
