<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Chi tiết đơn hàng')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main style="max-width:1000px;margin:35px auto"><h1 th:text="${'Đơn hàng #'+order.id}"></h1><p>Trạng thái: <b th:text="${order.status}"></b></p><p th:text="${order.fullname+' · '+order.phone}"></p><p th:text="${order.address}"></p><table style="width:100%"><thead><tr><th>Sản phẩm</th><th>Giá</th><th>SL</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="d:${details}"><td th:text="${d.product_name}"></td><td th:text="${money.fmt(d.price)}"></td><td th:text="${d.quantity}"></td><td th:text="${money.fmt(d.price*d.quantity)}"></td></tr></tbody></table><h3 th:text="${'Tổng: '+money.fmt(order.total_money)}"></h3><h3>Lịch sử trạng thái</h3><div th:each="h:${history}"><b th:text="${h.status}"></b> — <span th:text="${h.note}"></span> <small th:text="${h.created_at}"></small></div><form th:if="${order.status!='Đã giao' and order.status!='Đã hủy' and !isAdmin}" method="post" action="cancel_order.php"><input type="hidden" name="order_id" th:value="${order.id}"><button onclick="return confirm('Hủy đơn hàng này?')">Hủy đơn</button></form><a th:href="@{/print_order.php(id=${order.id})}">In đơn hàng</a></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
