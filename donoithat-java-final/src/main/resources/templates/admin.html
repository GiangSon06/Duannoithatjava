<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard - SLAND</title><link rel="stylesheet" href="/style.css"></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Admin Dashboard</h1><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:15px"><div class="stat-box"><b>Đơn hàng</b><h2 th:text="${ordersCount}"></h2></div><div class="stat-box"><b>Sản phẩm</b><h2 th:text="${productsCount}"></h2></div><div class="stat-box"><b>Người dùng</b><h2 th:text="${usersCount}"></h2></div><div class="stat-box"><b>Doanh thu</b><h2 th:text="${money.fmt(revenue)}"></h2></div></div><h2 id="orders-section">Đơn hàng gần đây</h2><table style="width:100%"><tr><th>ID</th><th>Khách</th><th>Tổng</th><th>Trạng thái</th><th></th></tr><tr th:each="o:${recentOrders}"><td th:text="${o.id}"></td><td th:text="${o.fullname}"></td><td th:text="${money.fmt(o.total_money)}"></td><td><form method="post" action="update_order_status.php"><input type="hidden" name="order_id" th:value="${o.id}"><select name="status"><option th:text="${o.status}" th:value="${o.status}"></option><option>Chờ xử lý</option><option>Đang chuẩn bị</option><option>Đang giao</option><option>Đã giao</option><option>Đã hủy</option></select><button>Cập nhật</button></form></td><td><a th:href="@{/order_detail.php(id=${o.id})}">Chi tiết</a></td></tr></table><h2>Sản phẩm sắp hết</h2><div th:each="p:${lowProducts}" th:text="${p.name+' — còn '+p.quantity}"></div></main></body></html>
