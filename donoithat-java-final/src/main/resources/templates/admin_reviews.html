<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Đánh giá</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Đánh giá</h1><table><tr><th>User</th><th>Sản phẩm</th><th>Sao</th><th>Nội dung</th><th></th></tr><tr th:each="r:${reviews}"><td th:text="${r.username}"></td><td th:text="${r.product_name}"></td><td th:text="${r.rating}"></td><td th:text="${r.content}"></td><td><form method="post"><input type="hidden" name="action" value="delete"><input type="hidden" name="id" th:value="${r.id}"><button>Xóa</button></form></td></tr></table></main></body></html>
