<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Đơn hàng của tôi')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main style="max-width:1100px;margin:35px auto"><h1>Đơn hàng của tôi</h1><div class="order-card" th:each="o:${orders}" style="border:1px solid #eee;padding:18px;margin:12px 0;border-radius:10px"><div><b th:text="${'Đơn #'+o.id}"></b> <span th:text="${o.status}"></span></div><p th:text="${'Ngày đặt: '+o.created_at}"></p><p>Tổng: <b th:text="${money.fmt(o.total_money)}"></b></p><a th:href="@{/order_detail.php(id=${o.id})}">Xem chi tiết</a></div></main><footer th:replace="~{fragments :: footer}"></footer></body></html>
