<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Affiliate Admin</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Quản lý Affiliate</h1><h2>Cộng tác viên</h2><table><tr><th>User</th><th>Mã</th><th>Rate</th><th>Số dư</th><th>Trạng thái</th><th></th></tr><tr th:each="a:${affiliates}"><td th:text="${a.username}"></td><td th:text="${a.ref_code}"></td><td th:text="${a.commission_rate+'%'}"></td><td th:text="${money.fmt(a.balance)}"></td><td th:text="${a.status}"></td><td><form method="post"><input type="hidden" name="aff_id" th:value="${a.id}"><button name="action" value="approve_aff">Duyệt</button><button name="action" value="ban_aff">Khóa</button></form></td></tr></table><h2>Yêu cầu rút tiền</h2><table><tr th:each="w:${withdrawals}"><td th:text="${w.username}"></td><td th:text="${money.fmt(w.amount)}"></td><td th:text="${w.status}"></td><td><form th:if="${w.status=='pending'}" method="post"><input type="hidden" name="wd_id" th:value="${w.id}"><button name="action" value="approve_withdrawal">Duyệt</button><button name="action" value="reject_withdrawal">Từ chối</button></form></td></tr></table><h2>Hoa hồng</h2><table><tr th:each="c:${commissions}"><td th:text="${c.aff_name}"></td><td th:text="${c.order_id}"></td><td th:text="${money.fmt(c.commission_amt)}"></td><td th:text="${c.status}"></td><td><form th:if="${c.status=='pending'}" method="post"><input type="hidden" name="comm_id" th:value="${c.id}"><button name="action" value="confirm_commission">Xác nhận</button></form></td></tr></table></main></body></html>
