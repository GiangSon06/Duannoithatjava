<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head('Đăng ký tài khoản')}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><div class="auth-container"><div class="auth-box"><h2>Đăng Ký Thành Viên</h2><p class="error" th:if="${error}" th:text="${error}"></p><p class="success" th:if="${success}" th:text="${success}"></p><form method="post" action="register.php" id="registerForm"><div class="input-group"><label>Tên đăng nhập</label><input name="username" required minlength="4" maxlength="20" th:value="${oldUsername}" placeholder="4–20 ký tự, chữ cái, số, dấu _"></div><div class="input-group"><label>Email</label><input type="email" name="email" required th:value="${oldEmail}"></div><div class="input-group"><label>Mật khẩu</label><input type="password" name="password" required minlength="6" maxlength="26" placeholder="6–26 ký tự, có chữ hoa và số"></div><div class="input-group"><label>Nhập lại mật khẩu</label><input type="password" name="confirm_password" required></div><button type="submit" name="register">Đăng ký</button></form><p>Đã có tài khoản? <a href="login.php">Đăng nhập</a></p></div></div><footer th:replace="~{fragments :: footer}"></footer></body></html>
