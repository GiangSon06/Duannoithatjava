<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Liên hệ</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Liên hệ khách hàng</h1><table><tr><th>Tên</th><th>SĐT</th><th>Nội dung</th><th>Trạng thái</th></tr><tr th:each="c:${contacts}"><td th:text="${c.full_name}"></td><td th:text="${c.phone}"></td><td th:text="${c.message}"></td><td><form method="post"><input type="hidden" name="id" th:value="${c.id}"><select name="status"><option value="new" th:selected="${c.status=='new'}">Mới</option><option value="read" th:selected="${c.status=='read'}">Đã đọc</option><option value="done" th:selected="${c.status=='done'}">Đã xử lý</option></select><button>Lưu</button></form></td></tr></table></main></body></html>
