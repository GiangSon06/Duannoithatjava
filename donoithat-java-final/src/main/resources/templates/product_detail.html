<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments :: head(${pageTitle})}"></th:block></head><body><header th:replace="~{fragments :: header}"></header><main class="product-detail"><div class="product-detail-container"><div class="product-image"><img th:src="${product.image_url}" th:alt="${product.name}"></div><div class="product-info"><div class="breadcrumb"><a href="index.php">Trang chủ</a> / <a th:href="@{/products.php(cate=${product.category_id})}" th:text="${product.category_name}"></a></div><h1 th:text="${product.name}"></h1><p class="old-price" th:if="${product.old_price != null}" th:text="${money.fmt(product.old_price)}"></p><p class="price" th:text="${money.fmt(product.price)}"></p><p th:text="${product.description}"></p><p><b>Chất liệu:</b> <span th:text="${product.material}"></span></p><p><b>Kích thước:</b> <span th:text="${product.dimensions}"></span></p><p><b>Bảo hành:</b> <span th:text="${product.warranty}"></span></p><p><b>Tồn kho:</b> <span th:text="${product.quantity}"></span></p><button th:attr="data-id=${product.id},data-name=${product.name},data-price=${product.price},data-img=${product.image_url}" onclick="addToCart(this)">Thêm vào giỏ</button></div></div><section class="review-section"><h2>Đánh giá sản phẩm</h2><form th:if="${loggedIn}" method="post" action="process_review.php"><input type="hidden" name="product_id" th:value="${product.id}"><select name="rating"><option th:each="n:${#numbers.sequence(5,1)}" th:value="${n}" th:text="${n+' sao'}"></option></select><textarea name="content" required></textarea><button>Gửi đánh giá</button></form><div class="review-card" th:each="r:${reviews}"><b th:text="${r.username}"></b><span th:text="${'★'.repeat(r.rating)}"></span><p th:text="${r.content}"></p></div></section><section class="products"><h2>Sản phẩm liên quan</h2><div class="product-list"><div class="product-card" th:each="p:${related}"><a th:href="@{/product_detail.php(id=${p.id})}"><img th:src="${p.image_url}"><h3 th:text="${p.name}"></h3></a><p class="price" th:text="${money.fmt(p.price)}"></p></div></div></section></main><th:block th:replace="~{fragments :: cart}"></th:block><footer th:replace="~{fragments :: footer}"></footer></body></html>
