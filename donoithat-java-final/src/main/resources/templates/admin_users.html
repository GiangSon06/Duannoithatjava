<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Người dùng</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Người dùng</h1><table><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Khóa</th><th></th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.is_locked}"></td><td><form th:if="${u.role!='admin'}" method="post"><input type="hidden" name="action" value="toggle_lock"><input type="hidden" name="id" th:value="${u.id}"><button th:text="${u.is_locked==1?'Mở khóa':'Khóa'}"></button></form></td></tr></table></main></body></html>
