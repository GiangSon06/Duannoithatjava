<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Thống kê</title></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Thống kê</h1><h2>Đơn theo trạng thái</h2><table><tr th:each="s:${byStatus}"><td th:text="${s.status}"></td><td th:text="${s.n}"></td></tr></table><h2>Top sản phẩm</h2><table><tr><th>Sản phẩm</th><th>Đã bán</th><th>Doanh thu</th></tr><tr th:each="p:${topProducts}"><td th:text="${p.product_name}"></td><td th:text="${p.qty}"></td><td th:text="${money.fmt(p.revenue)}"></td></tr></table><h2>Doanh thu theo ngày</h2><table><tr th:each="d:${daily}"><td th:text="${d.day}"></td><td th:text="${money.fmt(d.revenue)}"></td></tr></table></main></body></html>
