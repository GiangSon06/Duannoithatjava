<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Sản phẩm</title><link rel="stylesheet" href="/style.css"></head><body><aside th:replace="~{admin_fragments :: sidebar}"></aside><main style="margin-left:250px;padding:30px"><h1>Quản lý sản phẩm</h1><a href="admin_add_product.php">+ Thêm sản phẩm</a><table style="width:100%"><tr><th>ID</th><th>Ảnh</th><th>Tên</th><th>Giá</th><th>Tồn</th><th>Danh mục</th><th></th></tr><tr th:each="p:${products}"><td th:text="${p.id}"></td><td><img th:src="${p.image_url}" style="width:60px;height:60px;object-fit:cover"></td><td th:text="${p.name}"></td><td th:text="${money.fmt(p.price)}"></td><td th:text="${p.quantity}"></td><td th:text="${p.category_name}"></td><td><a th:href="@{/admin_edit_product.php(id=${p.id})}">Sửa</a> <a th:href="@{/admin_delete_product.php(id=${p.id})}" onclick="return confirm('Xóa sản phẩm?')">Xóa</a></td></tr></table></main></body></html>
